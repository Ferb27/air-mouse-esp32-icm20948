<rect x="0.00" y="0.00" width="794.00" height="1123.00" rx="5" fill="#fff" stroke="none" stroke-width="0" />
<text x="28.00" y="37.00" font-size="23" text-anchor="start" style="fill:#183044" font-weight="700">Sơ đồ khối nguồn</text>
<text x="28.00" y="64.00" font-size="13" text-anchor="start" style="fill:#183044">Luồng điện, không theo tỉ lệ. Tím = CELL−; đen = GND hệ thống.</text>
<text x="766.00" y="87.00" font-size="12" text-anchor="end" style="fill:#be2832">đề xuất, chưa đo thực tế</text>
