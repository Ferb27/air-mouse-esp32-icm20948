<rect x="85.00" y="120.00" width="305.00" height="65.00" rx="5" fill="#e2cef1" stroke="#587082" stroke-width="1.2" />
<text x="97.00" y="144.00" font-size="15" text-anchor="start" style="fill:#183044" font-weight="700">BAT1 · Pin 1S PCM, chưa chọn</text>
<text x="97.00" y="166.00" font-size="13" text-anchor="start" style="fill:#183044">1S PCM; chưa chọn pin</text>
</g>
<g data-ref="J1">
<rect x="85.00" y="225.00" width="305.00" height="65.00" rx="5" fill="#e2cef1" stroke="#587082" stroke-width="1.2" />
<text x="97.00" y="249.00" font-size="15" text-anchor="start" style="fill:#183044" font-weight="700">J1 · Giắc pin PH2.0</text>
<text x="97.00" y="271.00" font-size="13" text-anchor="start" style="fill:#183044">+ → B+ ; − → B−</text>
</g>
<g data-ref="MOD1">
<rect x="85.00" y="330.00" width="305.00" height="110.00" rx="5" fill="#bde4da" stroke="#587082" stroke-width="1.2" />
<text x="97.00" y="354.00" font-size="15" text-anchor="start" style="fill:#183044" font-weight="700">MOD1 · TP4056</text>
<text x="97.00" y="376.00" font-size="13" text-anchor="start" style="fill:#183044">B+/B−: phía cell</text>
<text x="97.00" y="393.55" font-size="13" text-anchor="start" style="fill:#183044">OUT+/OUT−: phía hệ thống</text>
<text x="97.00" y="411.10" font-size="13" text-anchor="start" style="fill:#183044">USB-C 5V chỉ khi sạc pin thật</text>
</g>
<g data-ref="SW1">
<rect x="85.00" y="500.00" width="305.00" height="65.00" rx="5" fill="#fde6b3" stroke="#587082" stroke-width="1.2" />
<text x="97.00" y="524.00" font-size="15" text-anchor="start" style="fill:#183044" font-weight="700">SW1 · Công tắc nguồn</text>
<text x="97.00" y="546.00" font-size="13" text-anchor="start" style="fill:#183044">OUT+ → ON ; COM → V_SYS</text>
</g>
<g data-ref="MOD2">
<rect x="85.00" y="610.00" width="305.00" height="80.00" rx="5" fill="#cfe0f9" stroke="#587082" stroke-width="1.2" />
<text x="97.00" y="634.00" font-size="15" text-anchor="start" style="fill:#183044" font-weight="700">MOD2 · MT3608</text>
<text x="97.00" y="656.00" font-size="13" text-anchor="start" style="fill:#183044">VIN+ = V_SYS ; VIN− = GND</text>
<text x="97.00" y="673.55" font-size="13" text-anchor="start" style="fill:#183044">VOUT+ = 5V ; VOUT− = GND</text>
</g>
<g data-ref="J5V">
<rect x="85.00" y="750.00" width="305.00" height="65.00" rx="5" fill="#e2cef1" stroke="#587082" stroke-width="1.2" />
<text x="97.00" y="774.00" font-size="15" text-anchor="start" style="fill:#183044" font-weight="700">J5V · Đầu 5V tháo rời</text>
<text x="97.00" y="796.00" font-size="13" text-anchor="start" style="fill:#183044">1 = +5V ; 2 = GND</text>
<text x="97.00" y="813.55" font-size="13" text-anchor="start" style="fill:#183044">tháo cả đầu cái khi dùng USB</text>
</g>
