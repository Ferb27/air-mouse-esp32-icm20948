; =============================================================================
; PlatformIO Configuration for Air Mouse BLE HID
; Board: ESP32 Classic DevKit 38-Pin (NodeMCU-32S / esp32doit-devkit-v1)
; Framework: Arduino
; =============================================================================

[platformio]
src_dir = .
include_dir = include

[env:esp32dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_ldf_mode = deep+

lib_deps =
    t-vk/ESP32 BLE Mouse @ ^0.3.1

build_flags =
    -I include
    -D CORE_DEBUG_LEVEL=3

build_src_filter =
    +<firmware.*>
    +<src/*.cpp>
