; =============================================================================
; Bench measurement for the detailed midterm report (2026-10-01)
; Reuses the production ICM-20948 driver from ../firmware (no copied code).
; Breadboard: ESP32 DevKit + WCMCU-20948 only (no buttons / LED / battery divider).
; =============================================================================

[env:esp32dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_port = COM3
upload_speed = 921600

build_flags =
    -I ../firmware/include
    -D CORE_DEBUG_LEVEL=0
