; =============================================================================
; PlatformIO Configuration for Hardware Bring-Up Probe
; Target: ESP32 DevKit 38-Pin (NodeMCU-32S / esp32doit-devkit-v1)
; =============================================================================

[env:esp32dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_port = COM8
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=3
